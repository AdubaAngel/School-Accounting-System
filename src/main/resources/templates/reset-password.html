<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - School Accounting</title>
    <link rel="stylesheet" th:href="@{/css/users.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="form-container">
        <h2>Reset User Password</h2>
        
        <div class="user-info-box">
            <p><strong>User:</strong> <span th:text="${user.fullName}"></span></p>
            <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
            <p><strong>Role:</strong> <span th:text="${user.role}"></span></p>
        </div>
        
        <form th:action="@{/users/reset-password/{id}(id=${user.id})}" method="post">
            
            <div class="form-group">
                <label for="newPassword" class="required">New Password</label>
                <input type="password" 
                       id="newPassword" 
                       name="newPassword" 
                       placeholder="Enter new password" 
                       required/>
                <small class="helper-text">Minimum 6 characters</small>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword" class="required">Confirm Password</label>
                <input type="password" 
                       id="confirmPassword" 
                       name="confirmPassword" 
                       placeholder="Confirm new password" 
                       required/>
            </div>
            
            <div class="info-box">
                ⚠️ <strong>Owner Only:</strong> This will immediately change the user's password. The user will need to use this new password to log in.
            </div>
            
            <div class="button-group">
                <button type="submit">🔐 Reset Password</button>
                <a href="/users/list" class="cancel-btn">Cancel</a>
            </div>
        </form>
        
        <a href="/users/list" class="back-link">← Back to Users List</a>
    </div>
</body>
</html>
