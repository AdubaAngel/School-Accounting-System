<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarvAngel Kids · School Accounting Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="login-container">
        <div class="brand-header">
            <img th:src="@{/images/marvangel-logo.jpeg}" alt="MarvAngel Kids Logo" class="logo-on-login" 
                 th:onerror="this.src='https://via.placeholder.com/80x80?text=MK'">
            <h1>📚 MarvAngel Kids</h1>
            <p>School Accounting System</p>
            <div class="school-badge">secure portal</div>
        </div>

        <div class="form-wrapper">
            <form th:action="@{/login}" method="post" class="login-form">
                <div class="input-group">
                    <label for="username">Email Address</label>
                    <input type="email" 
                           id="username" 
                           name="username" 
                           class="input-field" 
                           placeholder="Enter your email" 
                           autocomplete="email"
                           required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="input-field" 
                           placeholder="Enter your password" 
                           autocomplete="current-password"
                           required>
                </div>

                <button type="submit" class="login-btn">Sign in →</button>

                <div class="form-footer">
                    <a href="#" class="helper-link">Forgot password?</a>
                    <span class="sep">•</span>
                    <a href="#" class="helper-link">Contact support</a>
                </div>
            </form>

            <div th:if="${param.error}" class="alert-message error" role="alert">
                <span class="alert-icon">⚠️</span>
                <span>Invalid email or password</span>
            </div>
            
            <div th:if="${param.logout}" class="alert-message success" role="alert">
                <span class="alert-icon">✓</span>
                <span>You have been logged out</span>
            </div>
        </div>
    </div>
</body>
</html>
